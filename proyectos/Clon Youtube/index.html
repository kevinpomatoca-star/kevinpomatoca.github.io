<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="media.css">
</head>
<body>
  <!-- Header / Topbar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn menu-toggle" id="menuToggle" type="button" aria-label="Menú principal">
        <svg viewBox="0 0 24 24" class="svg-icon"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <a href="#inicio" class="brand" aria-label="YouTube Home">
        <span class="brand-logo">
          <svg viewBox="0 0 24 24" class="svg-icon-red"><path d="M21.58 7.19a2.506 2.506 0 0 0-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42a2.506 2.506 0 0 0-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.24.89.94 1.59 1.77 1.77 1.56.42 7.81.42 7.81.42s6.25 0 7.81-.42a2.506 2.506 0 0 0 1.77-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></svg>
        </span>
        <span class="brand-text">YouTube</span>
        <span class="brand-country">ES</span>
      </a>
    </div>

    <div class="topbar-center">
      <form class="search-form" id="searchForm" role="search">
        <div class="search-box">
          <input type="search" id="searchInput" placeholder="Buscar" autocomplete="off" aria-label="Buscar">
          <button type="button" class="clear-search" id="clearSearch" aria-label="Borrar búsqueda" hidden>&times;</button>
        </div>
        <button type="submit" class="search-btn" id="searchBtn" aria-label="Buscar">
          <svg viewBox="0 0 24 24" class="svg-icon"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </form>
      <button class="icon-btn voice-btn" type="button" aria-label="Buscar con la voz" title="Buscar con la voz">
        <svg viewBox="0 0 24 24" class="svg-icon"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
      </button>
    </div>

    <div class="topbar-right">
      <button class="icon-btn shorts-top-btn" id="topShortsBtn" type="button" title="Shorts" aria-label="Shorts">
        <img src="img/short.png" alt="Shorts" class="shorts-icon-img">
        <span class="shorts-btn-text">Shorts</span>
      </button>
      <button class="icon-btn" type="button" aria-label="Crear video" title="Crear">
        <svg viewBox="0 0 24 24" class="svg-icon"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2z"/></svg>
      </button>
      <button class="icon-btn" type="button" aria-label="Notificaciones" title="Notificaciones">
        <svg viewBox="0 0 24 24" class="svg-icon"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
      </button>
      <button class="user-avatar-btn" type="button" aria-label="Cuenta de usuario">
        <span class="avatar-initial">Y</span>
      </button>
    </div>
  </header>

  <div class="app-layout">
    <!-- Sidebar Overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <button class="sidebar-item active" type="button" data-nav="home">
          <svg viewBox="0 0 24 24" class="sidebar-icon"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span class="sidebar-text">Principal</span>
        </button>
        <button class="sidebar-item" type="button" data-nav="shorts">
          <img src="img/short.png" alt="Shorts" class="sidebar-short-img">
          <span class="sidebar-text">Shorts</span>
        </button>
        <button class="sidebar-item" type="button" data-nav="subscriptions">
          <svg viewBox="0 0 24 24" class="sidebar-icon"><path d="M18.7 8.7H5.3V7h13.4v1.7zm1.8-3.7H3.5V3.3h17V5zM22 12v8.5c0 .8-.7 1.5-1.5 1.5h-17c-.8 0-1.5-.7-1.5-1.5V12c0-.8.7-1.5 1.5-1.5h17c.8 0 1.5.7 1.5 1.5zm-2 .5H4v7h16v-7zM9.5 18.5V13l5 2.75-5 2.75z"/></svg>
          <span class="sidebar-text">Suscripciones</span>
        </button>
      </div>

      <hr class="sidebar-divider">

      <div class="sidebar-section">
        <div class="sidebar-heading">
          <span>Tú</span>
          <svg viewBox="0 0 24 24" class="sidebar-heading-arrow"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </div>
        <button class="sidebar-item" type="button">
          <svg viewBox="0 0 24 24" class="sidebar-icon"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm4.2 14.2L11 13V7h1.5v5.2l4.5 2.7-.8 1.3z"/></svg>
          <span class="sidebar-text">Historial</span>
        </button>
        <button class="sidebar-item" type="button">
          <svg viewBox="0 0 24 24" class="sidebar-icon"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg>
          <span class="sidebar-text">Tus videos</span>
        </button>
        <button class="sidebar-item" type="button">
          <svg viewBox="0 0 24 24" class="sidebar-icon"><path d="M12 3.67c-4.58 0-8.33 3.75-8.33 8.33s3.75 8.33 8.33 8.33 8.33-3.75 8.33-8.33S16.58 3.67 12 3.67zm.83 12.5H11.17V7.83h1.66V16.17z"/></svg>
          <span class="sidebar-text">Ver más tarde</span>
        </button>
      </div>

      <hr class="sidebar-divider">

      <div class="sidebar-section">
        <p class="sidebar-heading">Suscripciones</p>
        <div class="subscribed-channels" id="subscribedChannels">
          <!-- Injected by script.js -->
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="inicio">
      <!-- Category Filter Chips -->
      <section class="chips-container" aria-label="Categorías">
        <button class="chip active" type="button" data-category="all">Todo</button>
        <button class="chip" type="button" data-category="noticias">Noticias</button>
        <button class="chip" type="button" data-category="peliculas">Películas</button>
        <button class="chip" type="button" data-category="ciencia">Ciencia</button>
        <button class="chip" type="button" data-category="historia">Historia</button>
        <button class="chip" type="button" data-category="comedia">Comedia</button>
        <button class="chip" type="button" data-category="entretenimiento">Entretenimiento</button>
      </section>

      <!-- Main Video Grid Section -->
      <section class="videos-section" id="videosSection">
        <div class="section-title-wrapper" id="sectionHeader">
          <h2 class="section-title" id="currentSectionTitle">Videos recomendados</h2>
        </div>

        <div class="videos-grid" id="videosGrid" aria-live="polite">
          <!-- Video Cards injected by script.js -->
        </div>

        <!-- Shorts Special Section -->
        <div class="shorts-shelf" id="shortsShelf">
          <div class="shorts-shelf-header">
            <div class="shorts-shelf-title">
              <img src="img/short.png" alt="Shorts" class="shelf-short-icon">
              <h3>Shorts</h3>
            </div>
          </div>
          <div class="shorts-grid" id="shortsGrid">
            <!-- Shorts injected by script.js -->
          </div>
        </div>

        <!-- Empty state when no videos match -->
        <div class="empty-state" id="emptyState" hidden>
          <svg viewBox="0 0 24 24" class="empty-icon"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          <p class="empty-text">No se han encontrado resultados para tu búsqueda.</p>
          <button class="chip" id="resetFilterBtn" type="button">Restablecer filtros</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Video Player Modal for preview/play -->
  <div class="video-modal" id="videoModal" aria-hidden="true" role="dialog">
    <div class="video-modal-backdrop" id="modalBackdrop"></div>
    <div class="video-modal-container">
      <div class="video-modal-header">
        <h3 id="modalVideoTitle">Título del Video</h3>
        <button class="modal-close-btn" id="modalCloseBtn" aria-label="Cerrar modal">&times;</button>
      </div>
      <div class="video-modal-body">
        <div class="player-wrapper" id="playerWrapper">
          <!-- Dynamic video or img player inserted here -->
        </div>
        <div class="modal-video-meta">
          <div class="modal-channel-info">
            <img src="" alt="" id="modalChannelLogo" class="modal-channel-logo">
            <div>
              <p id="modalChannelName" class="modal-channel-name">Canal</p>
              <p id="modalVideoStats" class="modal-video-stats">Vistas y fecha</p>
            </div>
          </div>
          <button class="subscribe-btn" type="button">Suscribirse</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
